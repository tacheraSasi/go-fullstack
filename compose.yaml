services:
  # Main API service
  api:
    build:
      context: .
      target: final
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/core.db
      - JWT_SECRET=your-super-secret-jwt-key-change-this
      - JWT_EXPIRES_IN=24
      - LOG_FILE_PATH=/app/logs/app.log
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
